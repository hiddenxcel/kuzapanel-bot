<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hauna Mtandao — KuzaPanel Bot Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: radial-gradient(120% 100% at 50% 0%, #1e293b 0%, #0f172a 60%);
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
            padding: 20px;
            color: #fff;
            text-align: center;
        }
        .box { max-width: 360px; }
        .icon {
            width: 64px; height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, #4f46e5, #818cf8);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px;
            margin: 0 auto 20px;
        }
        h1 { font-size: 19px; margin: 0 0 8px; }
        p { font-size: 14px; color: #94a3b8; margin: 0 0 22px; line-height: 1.6; }
        button {
            padding: 11px 22px;
            background: #4f46e5; color: #fff;
            border: none; border-radius: 9px;
            font-size: 14px; font-weight: 700;
            cursor: pointer; font-family: inherit;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">📡</div>
        <h1>Hauna Mtandao</h1>
        <p>Imeshindikana kufikia KuzaPanel Bot Admin. Tafadhali angalia intaneti yako kisha jaribu tena.</p>
        <button onclick="location.reload()">Jaribu Tena</button>
    </div>
</body>
</html>
